# Production stack: Caddy (HTTPS) -> app (API + dashboard + webhook), worker, MongoDB, Redis.
# All settings come from .env (see .env.example). Start with:  docker compose up -d --build
# Only Caddy is reachable from outside; MongoDB and Redis stay on the private Docker network.

x-app: &app
  build: .
  image: whatsapp-realestate-engine
  restart: unless-stopped
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    NODE_ENV: production
    MONGO_URI: mongodb://mongo:27017/whatsapp_realestate
    REDIS_URL: ""
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    TRUST_PROXY: "1"
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "queues/broadcastWorker.js"]

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password is required; AOF keeps queued broadcasts and bot sessions across restarts.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (e.g. wa.bluxurytech.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
